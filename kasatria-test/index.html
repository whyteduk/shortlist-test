<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Page -->
  <div id="login">
    <div class="card">
      <h1>Welcome Back</h1>
      <p>Sign in with your Google account to view the table.</p>
      <button id="signin" type="button">
        <span class="g">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.4-4.8 7.1l7.7 6c4.5-4.2 6.9-10.3 6.9-17.6z"/>
      <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
      <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
    </svg>
  </span>
    Sign in with Google
      </button>
      <div id="error" role="alert"></div>
    </div>
  </div>

  <!-- 3D scene goes in here (Will be used in JS later) -->
  <div id="container"></div>

  <!-- For the buttons + colouring -->
  <div id="bar" hidden>
    <button data-layout="table">TABLE</button>
    <button data-layout="sphere">SPHERE</button>
    <button data-layout="helix">HELIX</button>
    <button data-layout="grid">GRID</button>
    <div id="legend">
      <span class="dot-red">&lt; $100K</span>
      <span class="dot-orange">$100K - $200K</span>
      <span class="dot-green">&gt; $200K</span>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@tweenjs/tween.js": "https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
